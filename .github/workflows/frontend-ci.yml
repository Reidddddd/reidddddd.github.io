name: Frontend CI

on:
  push:
    branches:
      - pisces
  pull_request:
    branches:
      - pisces

permissions:
  contents: read

jobs:
  check:
    name: JavaScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run syntax checks
        run: make check
